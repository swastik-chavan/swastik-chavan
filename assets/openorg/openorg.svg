<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="600" height="130">
  <defs>
    <linearGradient id="og-rosegold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b76e79" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a87c" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="130" fill="#0e0e0e" rx="5"/>
  <rect x="0.5" y="0.5" width="599" height="129" rx="5" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- CURRENTLY BUILDING label -->
  <text x="30" y="30" fill="#555555" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="9" font-weight="500" letter-spacing="2.5">CURRENTLY BUILDING</text>

  <!-- Rose-gold accent dot -->
  <circle cx="155" cy="27" r="2" fill="url(#og-rosegold)"/>

  <!-- OpenORG wordmark -->
  <text x="30" y="70" fill="#e8e8e8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="26" font-weight="600" letter-spacing="1.5">OpenORG</text>

  <!-- Description -->
  <text x="30" y="100" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="12" font-weight="300" letter-spacing="0.3">Organization management platform — keeping workflows simple.</text>

</svg>
