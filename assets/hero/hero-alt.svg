<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 190" width="850" height="190">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes glass-shift {
        0%, 100% { transform: translate(0, 0); opacity: 0.015; }
        50% { transform: translate(3px, -2px); opacity: 0.025; }
      }
    </style>
    <linearGradient id="rosegold-alt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b76e79" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c9a87c" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="190" fill="#0a0a0a" rx="6"/>
  <rect x="0.5" y="0.5" width="849" height="189" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- Single glass panel -->
  <rect x="200" y="30" width="250" height="130" rx="3" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5" style="animation: glass-shift 20s ease-in-out infinite;"/>

  <!-- SWASTIK -->
  <text x="425" y="78" text-anchor="middle" fill="#f0f0f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="42" font-weight="700" letter-spacing="6">SWASTIK</text>

  <!-- Accent line -->
  <line x1="370" y1="92" x2="480" y2="92" stroke="url(#rosegold-alt)" stroke-width="1" stroke-linecap="round"/>

  <!-- Subtitle -->
  <text x="425" y="120" text-anchor="middle" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="15" font-weight="300" font-style="italic" letter-spacing="2.5">Experimental Developer</text>

  <!-- Cursor blink -->
  <rect x="530" y="109" width="1.5" height="14" fill="#c9a87c" opacity="0.5" style="animation: blink 1.2s step-end infinite;"/>

  <!-- Intro -->
  <text x="425" y="155" text-anchor="middle" fill="#555555" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="13" font-weight="300" letter-spacing="0.3">I don't really stick to one thing. I just like figuring things out.</text>

</svg>
