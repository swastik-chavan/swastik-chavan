<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300">
  <defs>
    <style>
      @keyframes typing {
        0%, 100% { width: 0; }
        20%, 80% { width: 380px; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes glass-shift {
        0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.025; }
        50% { transform: translate(5px, -3px) rotate(0.5deg); opacity: 0.04; }
      }
    </style>
    <linearGradient id="rosegold-alt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b76e79" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c9a87c" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="text-clip">
      <rect x="235" y="90" width="0" height="50" style="animation: typing 8s ease-in-out infinite;"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="850" height="300" fill="#0d0d0d" rx="8"/>
  <rect x="0.5" y="0.5" width="849" height="299" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Glass panels -->
  <rect x="100" y="50" width="300" height="200" rx="4" fill="#ffffff" fill-opacity="0.015" stroke="#ffffff" stroke-opacity="0.025" stroke-width="0.5" style="animation: glass-shift 15s ease-in-out infinite;"/>
  <rect x="450" y="70" width="280" height="160" rx="4" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5" style="animation: glass-shift 20s ease-in-out infinite; animation-delay: -5s;"/>

  <!-- Name -->
  <text x="425" y="125" text-anchor="middle" fill="#f0f0f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="8">SWASTIK</text>

  <!-- Rose-gold accent line -->
  <line x1="350" y1="140" x2="500" y2="140" stroke="url(#rosegold-alt)" stroke-width="1" stroke-linecap="round"/>

  <!-- Subtitle -->
  <text x="425" y="175" text-anchor="middle" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="16" font-weight="300" font-style="italic" letter-spacing="3">Experimental Developer</text>

  <!-- Cursor blink -->
  <rect x="540" y="162" width="1.5" height="16" fill="#c9a87c" opacity="0.6" style="animation: blink 1.2s step-end infinite;"/>

  <!-- Intro -->
  <text x="425" y="218" text-anchor="middle" fill="#555555" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="13" font-weight="300" letter-spacing="0.5">I don't really stick to one thing. I just like figuring things out.</text>

</svg>
