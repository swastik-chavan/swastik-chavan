<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="850" height="140">
  <defs>
    <linearGradient id="tx-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a87c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b76e79" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="140" fill="#0e0e0e" rx="6"/>
  <rect x="0.5" y="0.5" width="849" height="139" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- TECH X wordmark -->
  <text x="70" y="62" fill="#e0e0e0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="3">TECH</text>
  <text x="162" y="62" fill="url(#tx-accent)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="1">X</text>

  <!-- Minimal X mark accent -->
  <line x1="192" y1="42" x2="202" y2="52" stroke="#c9a87c" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round"/>
  <line x1="202" y1="42" x2="192" y2="52" stroke="#c9a87c" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round"/>

  <!-- Handle -->
  <text x="70" y="85" fill="#555555" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="13" font-weight="400" letter-spacing="0.5">@tech.x.0</text>

  <!-- Description -->
  <text x="70" y="112" fill="#444444" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="11" font-weight="300" letter-spacing="0.3">Android apps, AI tools, customization, experiments.</text>

  <!-- Subtle play icon on the right -->
  <g transform="translate(750, 55)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#444444" stroke-width="0.8"/>
    <polygon points="16,12 30,20 16,28" fill="#444444"/>
  </g>

</svg>
