<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 90" width="600" height="90">
  <defs>
    <linearGradient id="tx-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a87c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b76e79" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="90" fill="#0e0e0e" rx="5"/>
  <rect x="0.5" y="0.5" width="599" height="89" rx="5" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- TECH X wordmark -->
  <text x="30" y="38" fill="#e0e0e0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="2">TECH</text>
  <text x="105" y="38" fill="url(#tx-accent)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="22" font-weight="700">X</text>

  <!-- Handle + description on same line -->
  <text x="30" y="62" fill="#555555" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="11" font-weight="400" letter-spacing="0.3">@tech.x.0</text>
  <text x="115" y="62" fill="#3a3a3a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="11" font-weight="300" letter-spacing="0.3">Apps · AI · Android · experiments</text>

  <!-- Subtle play icon -->
  <g transform="translate(540, 25)">
    <circle cx="15" cy="15" r="14" fill="none" stroke="#3a3a3a" stroke-width="0.7"/>
    <polygon points="12,8 22,15 12,22" fill="#3a3a3a"/>
  </g>

</svg>
