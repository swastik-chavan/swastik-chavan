<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="850" height="200">
  <defs>
    <style>
      @keyframes projectile-move {
        0% { transform: translateX(0); opacity: 0; }
        5% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(700px); opacity: 0; }
      }
      @keyframes stickman-recoil {
        0%, 10%, 100% { transform: translateX(0); }
        5% { transform: translateX(-2px); }
      }
    </style>
    <linearGradient id="projectile-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a87c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a87c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="200" fill="#0e0e0e" rx="4"/>

  <!-- Placeholder grid — this gets replaced by generate-contributions.js -->
  <g transform="translate(120, 30)">
    <!-- 52 weeks x 7 days placeholder grid -->
    <g fill="#1a1a1a" stroke="#222222" stroke-width="0.3">
      <!-- Row labels -->
      <text x="-15" y="15" fill="#444" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="end">M</text>
      <text x="-15" y="38" fill="#444" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="end">W</text>
      <text x="-15" y="61" fill="#444" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="end">F</text>

      <!-- Sample grid cells (placeholder — replaced by real data) -->
      <!-- This text indicates the placeholder state -->
    </g>

    <!-- Placeholder message -->
    <text x="310" y="50" text-anchor="middle" fill="#333333" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="300" letter-spacing="0.5">Contribution data loads after running the generator</text>
    <text x="310" y="70" text-anchor="middle" fill="#2a2a2a" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="300">node scripts/generate-contributions.js</text>
  </g>

  <!-- Stickman (stays in all versions) -->
  <g transform="translate(40, 60)" style="animation: stickman-recoil 12s linear infinite;">
    <!-- Head -->
    <circle cx="15" cy="15" r="6" fill="none" stroke="#e0e0e0" stroke-width="1.2"/>
    <!-- Body -->
    <line x1="15" y1="21" x2="15" y2="45" stroke="#e0e0e0" stroke-width="1.2"/>
    <!-- Left arm (holding) -->
    <line x1="15" y1="30" x2="5" y2="38" stroke="#e0e0e0" stroke-width="1.2"/>
    <!-- Right arm (gun) -->
    <line x1="15" y1="30" x2="35" y2="28" stroke="#e0e0e0" stroke-width="1.2"/>
    <!-- Gun -->
    <rect x="33" y="25" width="14" height="5" rx="1" fill="none" stroke="#c9a87c" stroke-opacity="0.5" stroke-width="0.8"/>
    <line x1="47" y1="27.5" x2="52" y2="27.5" stroke="#c9a87c" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- Left leg -->
    <line x1="15" y1="45" x2="8" y2="62" stroke="#e0e0e0" stroke-width="1.2"/>
    <!-- Right leg -->
    <line x1="15" y1="45" x2="22" y2="62" stroke="#e0e0e0" stroke-width="1.2"/>
  </g>

  <!-- Projectile -->
  <g style="animation: projectile-move 12s linear infinite;">
    <rect x="92" y="87" width="20" height="1.5" rx="0.75" fill="url(#projectile-glow)"/>
    <circle cx="112" cy="87.75" r="2" fill="#c9a87c" fill-opacity="0.7"/>
  </g>

  <!-- Footer label -->
  <text x="425" y="185" text-anchor="middle" fill="#2a2a2a" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="400" letter-spacing="1">GITHUB ACTIVITY</text>

</svg>
