<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 120" width="780" height="120">
  <defs>
    <linearGradient id="stats-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="ts-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="100%" stop-color="#4a90e2"/>
    </linearGradient>
    <linearGradient id="kt-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a97bff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a87c"/>
      <stop offset="100%" stop-color="#b76e79"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="780" height="120" fill="url(#stats-bg)" stroke="#222222" stroke-width="1" rx="6"/>

  <!-- Left: Activity Overview -->
  <g transform="translate(30, 24)">
    <text x="0" y="10" fill="#c9a87c" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">ACTIVITY OVERVIEW</text>
    
    <!-- Metrics columns -->
    <g transform="translate(0, 30)">
      <!-- Contributions -->
      <g transform="translate(0, 0)">
        <text x="0" y="22" fill="#f0f6fc" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600">99</text>
        <text x="0" y="40" fill="#777777" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="400">Total Contributions</text>
      </g>
      <!-- Repositories -->
      <g transform="translate(130, 0)">
        <text x="0" y="22" fill="#f0f6fc" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600">8</text>
        <text x="0" y="40" fill="#777777" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="400">Repositories</text>
      </g>
      <!-- Followers -->
      <g transform="translate(230, 0)">
        <text x="0" y="22" fill="#f0f6fc" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600">5</text>
        <text x="0" y="40" fill="#777777" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="400">Followers</text>
      </g>
    </g>
  </g>

  <!-- Divider -->
  <line x1="375" y1="20" x2="375" y2="100" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Right: Top Languages -->
  <g transform="translate(415, 24)">
    <text x="0" y="10" fill="#b76e79" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">TOP LANGUAGES</text>
    
    <!-- Progress Bar (Total width 335) -->
    <g transform="translate(0, 24)">
      <!-- Background track -->
      <rect x="0" y="0" width="335" height="8" rx="4" fill="#1c1c1c"/>
      <!-- TypeScript 62.1% (208px) -->
      <rect x="0" y="0" width="208" height="8" rx="4" fill="url(#ts-grad)"/>
      <!-- Kotlin 31.4% (105px) -->
      <rect x="210" y="0" width="105" height="8" rx="0" fill="url(#kt-grad)"/>
      <!-- Others 6.5% (20px) with rounded right end -->
      <rect x="317" y="0" width="18" height="8" rx="4" fill="url(#accent-grad)"/>
    </g>

    <!-- Legend -->
    <g transform="translate(0, 52)">
      <!-- TypeScript -->
      <circle cx="4" cy="4" r="3.5" fill="#3178c6"/>
      <text x="13" y="7" fill="#e0e0e0" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10">TypeScript <tspan fill="#666666">62.1%</tspan></text>

      <!-- Kotlin -->
      <circle cx="130" cy="4" r="3.5" fill="#a97bff"/>
      <text x="139" y="7" fill="#e0e0e0" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10">Kotlin <tspan fill="#666666">31.4%</tspan></text>

      <!-- CSS / JS / Other -->
      <circle cx="230" cy="4" r="3.5" fill="#c9a87c"/>
      <text x="239" y="7" fill="#e0e0e0" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10">Other <tspan fill="#666666">6.5%</tspan></text>
    </g>
  </g>
</svg>
